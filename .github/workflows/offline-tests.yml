# Offline tests on every push and PR: no API keys, no database, no Gemini or OpenAI calls.
name: offline-tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"

      # Any accidental supabase call fails instead of touching a database.
      - name: Block supabase CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/bin/sh\necho "supabase is blocked in CI" >&2\nexit 1\n' > "$RUNNER_TEMP/fakebin/supabase"
          chmod +x "$RUNNER_TEMP/fakebin/supabase"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"

      # The Docker image installs no dev or eval group, so the API must import without them.
      - name: API imports without dev and eval groups
        run: uv run --locked --no-dev python -c "import app.main"

      # db tests are marked in tests/conftest.py; this -m replaces the addopts one, so it repeats "not live".
      # tests/smoke/ calls the deployed service whenever SMOKE_BASE_URL is set.
      - name: Offline tests
        run: uv run --locked --group dev --group eval pytest -m "not db and not live" --ignore=tests/smoke
