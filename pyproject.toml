[project]
name = "opt-rag"
version = "0.1.0"
description = "Minimal RAG pipeline over Supabase pgvector with Gemini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
# ragas, langchain-*: step 10 eval judge only. ragas 0.4.3 imports
# langchain_community.chat_models.vertexai, which langchain-community 0.4 removed.
dev = [
    "langchain-community<0.4",
    "langchain-openai>=1.7.2",
    "pytest>=9.1.1",
    "ragas==0.4.3",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: calls a real external API (Gemini or eCFR); run with `uv run pytest -m live`"]
